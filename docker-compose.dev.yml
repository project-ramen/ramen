# 로컬 개발용 — Dockerfile로 직접 빌드, `docker compose watch`로 소스 변경 감지
#
# 관리자 API 비밀번호: .env에 RAMEN_ADMIN_PASSWORD=원하는비밀번호 설정 후
# 앱에서 블로그 연결 시 같은 비밀번호 입력. 비워두면 인증 없이 사용.
#
# PostgreSQL: .env에 POSTGRES_PASSWORD 설정(필수 권장). 첫 기동 시 DB·스키마 자동 생성.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ramen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ramen}
      POSTGRES_DB: ramen
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/migrate/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ramen -d ramen"]
      interval: 5s
      timeout: 5s
      retries: 5

  ramen:
    image: ramen:dev
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://ramen:${POSTGRES_PASSWORD:-ramen}@postgres:5432/ramen
      RAMEN_ADMIN_PASSWORD: ${RAMEN_ADMIN_PASSWORD:-}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    # `docker compose watch` 로 실행 시 소스 변경을 감지.
    # server: bun run start는 자체 watch가 없어 변경 시 프로세스 재시작(sync+restart).
    # web: 정적/SSR 빌드 산출물이라 소스만 바꿔선 반영 안 되므로 이미지 재빌드(rebuild).
    develop:
      watch:
        - action: sync+restart
          path: ./server/src
          target: /app/src
        - action: rebuild
          path: ./server/package.json
        - action: rebuild
          path: ./web

volumes:
  postgres_data:
  uploads_data:
